[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mod-rot-3"
version = "0.1.0"
description = "Reproducible binary choice NP and independent latent rotation research"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "torch>=2.0",
  "scikit-learn>=1.3", "matplotlib>=3.7",
  "pandas>=2.0", "PyYAML>=6.0",
]
[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]