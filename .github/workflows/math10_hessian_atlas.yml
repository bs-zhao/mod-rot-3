name: Math10 Hessian atlas smoke tests
on:
  push:
    paths:
      - 'math/10_multimodel_hessian_simplicity/**'
      - '.github/workflows/math10_hessian_atlas.yml'
  pull_request:
    paths:
      - 'math/10_multimodel_hessian_simplicity/**'
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical test dependencies
        run: python -m pip install numpy scipy
      - name: Run standalone math10 tests
        run: python -m unittest discover -s math/10_multimodel_hessian_simplicity -p 'test_*.py' -v
